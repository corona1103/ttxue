<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ttx产品demo汇总</title>
  <style>
    :root { --text:#202638; --muted:#8a92a3; --line:#e6e9ef; --bg:#f7f8fa; --blue:#515bd8; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
    a { color:inherit; text-decoration:none; }
    .wrap { width:min(960px,calc(100% - 40px)); margin:0 auto; }
    header { padding:54px 0 34px; border-bottom:1px solid var(--line); }
    h1 { margin:0; font-size:28px; font-weight:700; letter-spacing:-.03em; }
    header p { margin:10px 0 0; color:var(--muted); font-size:13px; }
    main { padding:30px 0 60px; }
    .modules { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
    .module { padding:20px; border:1px solid var(--line); border-radius:12px; background:#fff; }
    .module h2 { margin:0 0 14px; font-size:16px; font-weight:650; }
    .demo-list { display:flex; flex-direction:column; gap:8px; }
    .demo { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 14px; border:1px solid var(--line); border-radius:8px; background:#fff; transition:border-color .15s,background .15s; }
    .demo:hover { border-color:#aeb4ee; background:#fafaff; }
    .demo-title { font-size:13px; font-weight:600; }
    .demo-meta { display:block; margin-top:4px; color:var(--muted); font-size:11px; }
    .demo-arrow { color:var(--blue); font-size:14px; }
    .empty { padding:14px; border:1px dashed var(--line); border-radius:8px; color:var(--muted); font-size:11px; }
    footer { padding:20px 0 34px; color:var(--muted); font-size:11px; }
    @media (max-width:640px) { .wrap { width:min(100% - 28px,520px); } header { padding:38px 0 25px; } .modules { grid-template-columns:1fr; gap:12px; } .module { padding:16px; } }
  </style>
</head>
<body>
  <header><div class="wrap"><h1>ttx产品demo汇总</h1><p>天天学产品 Demo 入口</p></div></header>
  <main class="wrap">
    <div class="modules">
      <section class="module"><h2>App</h2><div class="demo-list"><div class="empty">暂无 Demo</div></div></section>
      <section class="module"><h2>创作者</h2><div class="demo-list"><a class="demo" href="../" target="_blank"><span><span class="demo-title">创作者中心 · 1030</span><span class="demo-meta">登录实名认证及基础数据展示</span></span><span class="demo-arrow">›</span></a></div></section>
      <section class="module"><h2>赛事</h2><div class="demo-list"><div class="empty">暂无 Demo</div></div></section>
      <section class="module"><h2>后台</h2><div class="demo-list"><a class="demo" href="../product-ops-demo/" target="_blank"><span><span class="demo-title">运营后台 · 1117</span><span class="demo-meta">合集运营、微课配置、收入与结算管理</span></span><span class="demo-arrow">›</span></a></div></section>
    </div>
  </main>
  <footer><div class="wrap">按「标题 · 版本号」命名，持续收录产品评审 Demo。</div></footer>
</body>
</html>
